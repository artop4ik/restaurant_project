<nav class="restaurant-nav">

    <div class="nav-container">

        <!-- Название ресторана -->
        <a href="/" class="restaurant-brand">
            ☕ Назва ресторану
        </a>


        <!-- Центральная навигация -->
        <div class="nav-links">

            {% if current_user.is_authenticated %}

                <a href="/menu" class="nav-link">
                    🍕 Меню
                </a>

                <a href="/cart" class="nav-link">
                    🛒 Кошик
                </a>

                <a href="/my_orders" class="nav-link">
                    📦 Мої замовлення
                </a>
                      </a>
                <a href="/reservation" class="nav-link">
                   резервації
                      </a>   


            {% else %}

                <a href="/menu" class="nav-link">
                    🍕 Меню
          
            {% endif %}

        </div>


        <!-- Правая часть -->
        <div class="nav-user">

            {% if current_user.is_authenticated %}

                <span class="username">
                    👤 {{ current_user.nickname }}
                </span>


                {% if current_user.role == 'admin' %}

                    <a href="/admin"
                       class="admin-button">

                        🛡️ Адмін

                    </a>
                    

                {% endif %}


                <form action="/logout"
                      method="post"
                      class="logout-form">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ session['csrf_token'] }}">

                    <button type="submit"
                            class="logout-button">

                        Вийти

                    </button>

                </form>


            {% else %}

                <a href="/login"
                   class="login-button">

                    Увійти

                </a>

                <a href="/register"
                   class="register-button">

                    Реєстрація

                </a>

            {% endif %}

        </div>

    </div>

</nav>
